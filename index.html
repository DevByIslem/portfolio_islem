<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Islem Naimi | Data Analyst</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

/* HEADER */
header {
  text-align: center;
  padding: 60px 20px;
}

.profile {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 3px solid #38bdf8;
}

/* BUTTON */
.btn {
  padding: 10px 15px;
  background: #38bdf8;
  color: black;
  border-radius: 8px;
  text-decoration: none;
  margin-top: 10px;
  display: inline-block;
}

/* SECTION */
section {
  max-width: 1000px;
  margin: auto;
  padding: 40px 20px;
}

/* SKILLS CAROUSEL */
.skills-container {
  display: flex;
  overflow-x: auto;
  gap: 15px;
  padding: 10px;
}

.skill {
  min-width: 120px;
  background: rgba(255,255,255,0.08);
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  transition: 0.3s;
}

.skill:hover {
  transform: scale(1.1);
  background: #38bdf8;
  color: black;
}

/* EXPERIENCE */
.exp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}

.exp-card {
  background: rgba(255,255,255,0.08);
  padding: 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.3s;
}

.exp-card:hover {
  transform: translateY(-5px);
  background: #1e293b;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  color: black;
  padding: 20px;
  border-radius: 10px;
  width: 80%;
}

.close {
  float: right;
  cursor: pointer;
  font-size: 20px;
}
</style>
</head>

<body>

<header>
  <img src="https://i.imgur.com/8Km9tLL.png" class="profile">
  <h1>ISLEM NAIMI</h1>
  <p>Data Analyst | SQL | Power BI | Python</p>
  <a class="btn" href="CV.pdf">Download CV</a>
</header>

<!-- SKILLS -->
<section>
<h2>Skills</h2>

<div class="skills-container">

  <div class="skill"><i class="fa-brands fa-python"></i><br>Python</div>
  <div class="skill"><i class="fa-solid fa-database"></i><br>SQL</div>
  <div class="skill"><i class="fa-solid fa-chart-line"></i><br>Power BI</div>
  <div class="skill"><i class="fa-solid fa-table"></i><br>Excel</div>
  <div class="skill"><i class="fa-solid fa-gears"></i><br>ETL</div>

</div>
</section>

<!-- EXPERIENCE -->
<section>
<h2>Experience</h2>

<div class="exp-grid">

<div class="exp-card" onclick="openModal('m1')">
<h3>Data Analyst</h3>
<p>BIAT / UNICEF</p>
</div>

<div class="exp-card" onclick="openModal('m2')">
<h3>Data Scientist Intern</h3>
<p>Machine Learning</p>
</div>

<div class="exp-card" onclick="openModal('m3')">
<h3>Web & Data Developer</h3>
<p>SQL + ETL</p>
</div>

</div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <div id="modal-text"></div>
  </div>
</div>

<script>
function openModal(id) {
  let content = "";

  if(id === "m1") {
    content = "Data Analyst: BIAT, Amen Bank, UNICEF, UNDP, GIZ. SQL, Power BI dashboards, data validation.";
  }

  if(id === "m2") {
    content = "Data Scientist Intern: Machine Learning, Python, Django platform, predictive models.";
  }

  if(id === "m3") {
    content = "Web & Data Developer: CRM systems, ETL pipelines, SQL integration, automation.";
  }

  document.getElementById("modal-text").innerText = content;
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
